<title>Auge 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #eef1f4;
    --bg-2: #dfe5ea;
    --surface: rgba(255, 255, 255, 0.92);
    --surface-solid: #ffffff;
    --text: #17212b;
    --text-2: #4d5b69;
    --line: rgba(23, 33, 43, 0.14);
    --accent: #1f6fb2;
    --accent-text: #ffffff;
    --accent-soft: rgba(31, 111, 178, 0.14);
    --warn: #8a5a00;
    --label-bg: rgba(255, 255, 255, 0.9);
    --shadow: 0 2px 14px rgba(20, 30, 40, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d;
      --bg-2: #1b232b;
      --surface: rgba(28, 36, 45, 0.93);
      --surface-solid: #1c242d;
      --text: #e8eef3;
      --text-2: #a5b3c0;
      --line: rgba(232, 238, 243, 0.16);
      --accent: #5aa9e6;
      --accent-text: #0b1722;
      --accent-soft: rgba(90, 169, 230, 0.2);
      --warn: #e0b45a;
      --label-bg: rgba(28, 36, 45, 0.9);
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d;
    --bg-2: #1b232b;
    --surface: rgba(28, 36, 45, 0.93);
    --surface-solid: #1c242d;
    --text: #e8eef3;
    --text-2: #a5b3c0;
    --line: rgba(232, 238, 243, 0.16);
    --accent: #5aa9e6;
    --accent-text: #0b1722;
    --accent-soft: rgba(90, 169, 230, 0.2);
    --warn: #e0b45a;
    --label-bg: rgba(28, 36, 45, 0.9);
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { position: fixed; inset: 0; width: 100%; }

  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
    font-size: 11.5px; line-height: 1.2; padding: 2px 6px; border-radius: 6px;
    background: var(--label-bg); color: var(--text); border: 1px solid var(--line);
  }
  .lbl.sel { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #leader { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #leader line { stroke: var(--text-2); stroke-width: 1; opacity: 0.7; }

  .bar {
    position: absolute; left: 0; right: 0; z-index: 5;
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
    display: flex; align-items: center; gap: 8px;
  }
  #topbar {
    top: 0; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 8px;
    background: linear-gradient(var(--bg), transparent);
  }
  #topbar h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 650; white-space: nowrap; }
  #topbar h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--text-2); }
  .btn {
    min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font: inherit; font-size: 14px; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #chips {
    position: absolute; z-index: 5; left: 0; right: 0;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 122px);
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    padding: 0 max(10px, env(safe-area-inset-left));
  }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 22px; font-size: 13px; }

  #bottombar {
    bottom: 0; flex-direction: column; align-items: stretch; gap: 6px;
    padding-top: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 22%);
  }
  #exploCard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 8px 12px 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  #exploLabel { font-size: 13px; font-weight: 600; flex: 1; }
  #exploLabel span { color: var(--accent); font-variant-numeric: tabular-nums; }
  #explo { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); touch-action: pan-y; }
  #exploCard .btn { min-height: 44px; box-shadow: none; }
  #note { font-size: 11px; color: var(--warn); text-align: center; padding: 0 4px; }

  .sheet {
    position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 46%;
    background: var(--surface-solid); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.25);
    display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform 0.25s ease; visibility: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: none; visibility: visible; }
  #listSheet { max-height: 70%; }
  .grab { padding: 8px 0 4px; display: flex; justify-content: center; touch-action: none; }
  .grab i { width: 40px; height: 4px; border-radius: 2px; background: var(--line); display: block; }
  .sheet-head { display: flex; align-items: flex-start; gap: 8px; padding: 2px 14px 6px; }
  .sheet-head .titles { flex: 1; min-width: 0; }
  .sheet-head h2 { margin: 0; font-size: 20px; line-height: 1.2; }
  .sheet-head .de { color: var(--text-2); font-size: 14px; }
  .sheet-head .grp { color: var(--accent); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sheet-body { overflow-y: auto; padding: 0 14px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet-body p { margin: 6px 0; }
  .sheet-body ul { margin: 6px 0; padding-left: 20px; }
  .sheet-body li { margin: 2px 0; }
  .clinic { border-left: 3px solid var(--accent); padding: 4px 10px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .clinic b { color: var(--accent); }
  .actions { display: flex; gap: 8px; padding: 6px 14px 10px; flex-wrap: wrap; }
  .actions .btn { flex: 1; box-shadow: none; }

  .group h3 {
    margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2);
  }
  .item { display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid var(--line); }
  .item .nm { flex: 1; min-height: 44px; padding: 4px 4px; background: none; border: 0; color: var(--text);
    text-align: left; font: inherit; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
  .item .nm small { color: var(--text-2); font-size: 12px; }
  .item.sel .nm { color: var(--accent); font-weight: 600; }
  .item .eye {
    width: 44px; height: 44px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-size: 18px;
  }
  .item.off .nm { opacity: 0.45; }
  .item.off .eye { opacity: 0.5; }

  /* Landscape / Desktop: Seitenpanel rechts */
  @media (min-width: 900px), (orientation: landscape) and (min-width: 700px) {
    .sheet {
      left: auto; right: 0; top: 0; bottom: 0; width: 380px; max-height: none; border-radius: 0;
      border-top: 0; border-left: 1px solid var(--line); transform: translateX(105%);
      padding-top: env(safe-area-inset-top);
    }
    .sheet.open { transform: none; }
    #listSheet { max-height: none; }
    .grab { display: none; }
    #xbtn { display: inline-flex; }
    body:has(.sheet.open) #bottombar, body:has(.sheet.open) #chips { right: 380px; }
    body:has(.sheet.open) #topbar { padding-right: 390px; }
  }
  @media (max-width: 899px) and (orientation: portrait) { #xbtn { display: inline-flex; } }
  @media (max-height: 520px) { #chips { display: none; } }
  /* Querformat (Handy): Explosionskarte klein rechts unten, Regler und Buttons in einer Zeile */
  @media (max-height: 520px) and (orientation: landscape) {
    #bottombar { left: auto; width: min(460px, 62vw); background: none; padding-top: 0; }
    #exploCard { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
    #exploCard .row { display: contents; }
    #exploLabel { flex: none; order: 1; white-space: nowrap; }
    #explo { flex: 1; order: 2; min-width: 0; height: 36px; }
    #btnTogether, #btnExploded { order: 3; min-height: 36px; padding: 0 10px; }
    #note { font-size: 10px; text-align: right; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div id="stage"><canvas id="gl" tabindex="0" aria-label="3D-Modell des rechten Auges"></canvas></div>
<svg id="leader"></svg>
<div id="labels"></div>

<div id="topbar" class="bar">
  <h1>Auge 3D<small>Oculus dexter · rechtes Auge</small></h1>
  <button class="btn" id="btnList" aria-label="Teile-Liste öffnen">Teile</button>
  <button class="btn" id="btnLabels" aria-pressed="true" aria-label="Beschriftung an oder aus">Beschriftung</button>
  <button class="btn" id="btnReset" aria-label="Ansicht zurücksetzen" title="Ansicht zurücksetzen">⟲</button>
</div>

<div id="chips" role="group" aria-label="Ansichten">
  <button class="btn chip" data-view="front">Frontal</button>
  <button class="btn chip" data-view="lateral">Lateral</button>
  <button class="btn chip" data-view="superior">Superior</button>
  <button class="btn chip" data-view="posterior">Posterior</button>
</div>

<div id="bottombar" class="bar">
  <div id="exploCard">
    <div class="row">
      <div id="exploLabel">Explosion <span id="exploVal">0 %</span></div>
      <button class="btn" id="btnTogether">Zusammen</button>
      <button class="btn" id="btnExploded">Explodiert</button>
    </div>
    <input type="range" id="explo" min="0" max="100" value="0" step="1" aria-label="Explosionsgrad in Prozent">
  </div>
  <div id="note">Schichtdicken von Retina und Choroidea zur Darstellung überhöht.</div>
</div>

<div id="infoSheet" class="sheet" role="dialog" aria-label="Teil-Information">
  <div class="grab" id="infoGrab"><i></i></div>
  <div class="sheet-head">
    <div class="titles">
      <div class="grp" id="infoGrp"></div>
      <h2 id="infoLa"></h2>
      <div class="de" id="infoDe"></div>
    </div>
    <button class="btn" id="infoClose" aria-label="Schließen">✕</button>
  </div>
  <div class="sheet-body" id="infoBody"></div>
  <div class="actions">
    <button class="btn primary" id="btnIsolate">Isolieren</button>
    <button class="btn" id="btnHide">Ausblenden</button>
    <button class="btn" id="btnShowAll">Alle zeigen</button>
  </div>
</div>

<div id="listSheet" class="sheet" role="dialog" aria-label="Teile-Liste">
  <div class="grab" id="listGrab"><i></i></div>
  <div class="sheet-head">
    <div class="titles"><h2>Teile</h2><div class="de" id="listCount"></div></div>
    <button class="btn" id="btnShowAll2">Alle zeigen</button>
    <button class="btn" id="listClose" aria-label="Schließen">✕</button>
  </div>
  <div class="sheet-body" id="listBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/textures.js"></script>
<script src="js/geometry.js"></script>
<script src="js/app.js"></script>
